<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bốc Thăm Nhiều Vòng - THCS Vĩnh Phú</title>
    <style>
        :root { --bg: #090d16; --card: #111827; --border: #1f2937; --accent: #0ea5e9; --success: #22c55e; --text: #f3f4f6; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 24px; text-transform: uppercase; color: #fff; margin: 0; }
        .main-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin: 15px 0; }
        input { flex: 1; background: #030712; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; outline: none; }
        input:focus { border-color: var(--accent); }
        button { font-weight: 600; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-add { background: var(--accent); color: white; }
        .btn-draw { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; text-transform: uppercase; font-weight: 700; font-size: 15px; }
        .btn-next { width: 100%; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; text-transform: uppercase; font-weight: 700; font-size: 15px; margin-top: 15px; display: none; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; max-height: 120px; overflow-y: auto; }
        .team-tag { background: #1f2937; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .btn-del { background: none; color: #ef4444; padding: 0; }
        .results-panel { margin-top: 20px; }
        .results-panel h2 { font-size: 18px; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 15px; }
        .match-card { background: #111827; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .match-title { font-size: 12px; color: #6b7280; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .slots { display: flex; flex-direction: column; gap: 8px; }
        .slot { padding: 12px; background: #030712; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .slot:hover { border-color: var(--accent); }
        .slot.winner { border-color: var(--success); background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .slot.winner::after { content: '✓ THẮNG'; font-size: 11px; font-weight: 800; background: var(--success); color: #000; padding: 2px 6px; border-radius: 4px; }
        .special-card { border-left: 4px solid #a855f7; }
        .champ-box { text-align: center; padding: 30px; background: rgba(234, 179, 8, 0.1); border: 2px solid #eab308; border-radius: 16px; color: #eab308; font-size: 20px; font-weight: 800; text-transform: uppercase; animation: pulse 1.5s infinite alternate; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Tournament Manager</h1>
        <p style="color:#6b7280; margin:0; font-size:13px;">Bốc thăm ngẫu nhiên & Quản lý đội thắng qua từng vòng</p>
    </div>
    <div class="main-box" id="setupArea">
        <div style="font-size:13px; color:#9ca3af; font-weight:600; margin-bottom:10px;">Danh sách đội (<span id="count">0</span>)</div>
        <div class="tag-container" id="tagList"></div>
        <div class="input-group">
            <input type="text" id="teamInput" placeholder="Nhập tên đội bóng...">
            <button class="btn-add" onclick="addTeam()">Thêm</button>
        </div>
        <button class="btn-draw" onclick="generateRound(1)">Bắt đầu giải đấu (Vòng 1)</button>
    </div>
    <div class="results-panel" id="activeRoundArea" style="display:none;">
        <h2 id="roundTitle">Vòng 1</h2>
        <p style="font-size:13px; color:#6b7280; text-align:center; margin-top:-10px; margin-bottom:15px;">👉 Ấn vào đội ghi bàn/chiến thắng để chọn đội đi tiếp</p>
        <div id="matchContainer"></div>
        <button class="btn-next" id="nextRoundBtn" onclick="advanceToNextRound()">Bốc thăm vòng tiếp theo ➔</button>
    </div>
</div>
<script>
    let activeTeams = [], currentMatches = [], roundNum = 1;
    function addTeam() {
        let inp = document.getElementById('teamInput'), val = inp.value.trim();
        if (!val || activeTeams.includes(val)) return inp.value = '';
        activeTeams.push(val); inp.value = ''; render();
    }
    function render() {
        document.getElementById('count').innerText = activeTeams.length;
        let html = '';
        activeTeams.forEach((t, i) => html += `<div class="team-tag"><span>${t}</span><button class="btn-del" onclick="activeTeams.splice(${i},1);render();">✕</button></div>`);
        document.getElementById('tagList').innerHTML = html;
    }
    function generateRound(rNum) {
        if (rNum === 1 && activeTeams.length < 2) return alert('Cần tối thiểu 2 đội!');
        roundNum = rNum;
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('activeRoundArea').style.display = 'block';
        document.getElementById('roundTitle').innerText = `Vòng số ${roundNum}`;
        document.getElementById('nextRoundBtn').style.display = 'none';
        
        let shuffled = [...activeTeams];
        for (let i = shuffled.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        currentMatches = [];
        let box = document.getElementById('matchContainer'), html = '', mIdx = 1;
        box.innerHTML = '';
        
        while (shuffled.length > 1) {
            let t1 = shuffled.pop(), t2 = shuffled.pop();
            currentMatches.push({ t1, t2, winner: null });
            html += `<div class="match-card"><div class="match-title">Trận ${mIdx}</div><div class="slots"><div class="slot" onclick="pickWinner(${mIdx-1}, '${t1}', this)">${t1}</div><div class="slot" onclick="pickWinner(${mIdx-1}, '${t2}', this)">${t2}</div></div></div>`;
            mIdx++;
        }
        if (shuffled.length === 1) {
            let byeTeam = shuffled.pop();
            currentMatches.push({ t1: byeTeam, t2: null, winner: byeTeam });
            html += `<div class="match-card special-card"><div class="match-title" style="color:#a855f7;">Đặc cách đi tiếp</div><div class="slots"><div class="slot winner">${byeTeam}</div></div></div>`;
        }
        box.innerHTML = html;
        checkRoundStatus();
    }
    function pickWinner(mIdx, teamName, element) {
        let cardSlots = element.parentNode.querySelectorAll('.slot');
        cardSlots.forEach(s => s.classList.remove('winner'));
        element.classList.add('winner');
        currentMatches[mIdx].winner = teamName;
        checkRoundStatus();
    }
    function checkRoundStatus() {
        let allSettled = currentMatches.every(m => m.winner !== null);
        document.getElementById('nextRoundBtn').style.display = allSettled ? 'block' : 'none';
    }
    function advanceToNextRound() {
        activeTeams = currentMatches.map(m => m.winner);
        if (activeTeams.length === 1) {
            document.getElementById('matchContainer').innerHTML = `<div class="champ-box">🏆 Nhà Vô Địch 🏆<br><br><span style="font-size:26px; color:#fff;">${activeTeams[0]}</span></div>`;
            document.getElementById('nextRoundBtn').style.display = 'none';
            document.getElementById('roundTitle').innerText = "Kết thúc giải đấu";
        } else {
            generateRound(roundNum + 1);
        }
    }
    document.getElementById('teamInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addTeam(); });
</script>
</body>
</html>
